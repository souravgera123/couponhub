<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CouponHub Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <b>✦ CouponHub Admin</b>
  <nav>
    <a href="/">Store</a>
    <button id="logout" style="display:none">Logout</button>
  </nav>
</header>

<section id="loginBox" class="box" style="max-width:420px;margin:40px auto">
  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button class="btn" id="login">Login</button>

  <p id="loginMsg"></p>
</section>

<section id="dashboard" style="display:none">

  <small>ADMIN</small>
  <h2>Dashboard</h2>

  <div id="stats"></div>

  <div class="box">
    <h3>Add Coupon</h3>

    <input id="brand" placeholder="Brand">
    <input id="title" placeholder="Coupon title">
    <input id="category" placeholder="Category">
    <input id="desc" placeholder="Description">

    <input id="original" type="number" placeholder="Original price">
    <input id="selling" type="number" placeholder="Selling price">

    <textarea id="code" placeholder="Multiple coupon codes (one per line)" rows="5"></textarea>
    <input id="stock" type="number" value="1" placeholder="Stock" readonly>

    <button class="btn" id="add">Add Coupon</button>
  </div>

  <div id="list"></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const sb = supabase.createClient(
  window.COUPONHUB_CONFIG.SUPABASE_URL,
  window.COUPONHUB_CONFIG.SUPABASE_ANON_KEY
);

const $ = s => document.querySelector(s);

async function checkAdmin() {

  const { data: { user } } = await sb.auth.getUser();

  if (!user) {
    $('#loginBox').style.display = 'block';
    $('#dashboard').style.display = 'none';
    return;
  }

  const { data: profile } = await sb
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .single();

  if (profile?.role !== 'admin') {
    $('#loginMsg').textContent = 'Admin access required.';
    await sb.auth.signOut();
    $('#loginBox').style.display = 'block';
    return;
  }

  $('#loginBox').style.display = 'none';
  $('#dashboard').style.display = 'block';
  $('#logout').style.display = 'inline-block';

  load();
}

$('#login').onclick = async () => {

  const email = $('#email').value.trim();
  const password = $('#password').value;

  if (!email || !password) {
    $('#loginMsg').textContent = 'Email and password required.';
    return;
  }

  $('#loginMsg').textContent = 'Logging in...';

  const { error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    $('#loginMsg').textContent = error.message;
    return;
  }

  $('#loginMsg').textContent = '';

  checkAdmin();
};

async function load() {

  const { data: coupons } = await sb
    .from('coupons')
    .select('*')
    .order('created_at', { ascending: false });

  $('#list').innerHTML =
    (coupons || []).map(x => `
      <div class="order">
        <b>${x.title}</b>
• ${x.category}
• ₹${x.selling_price}
• stock ${x.stock}

<button onclick="editStock('${x.id}')">
  Edit Stock
</button>

<button onclick="del('${x.id}')">
  Delete
</button>
      </div>
    `).join('');

  const session =
    (await sb.auth.getSession()).data.session;

  const r = await fetch('/api/admin/stats', {
    headers: {
      Authorization: 'Bearer ' + session.access_token
    }
  });

  const s = await r.json();

  $('#stats').innerHTML = `
    <div class="order">
      <b>Coupons:</b> ${s.coupons}
      &nbsp;
      <b>Orders:</b> ${s.orders}
      &nbsp;
      <b>Sales:</b> ₹${s.sales}
    </div>
  `;
}

$('#add').onclick = async () => {

  const codes = $('#code').value
  .split('\n')
  .map(x => x.trim())
  .filter(Boolean);

if (codes.length === 0) {
  alert('At least one coupon code required!');
  return;
}

const v = {
  brand: $('#brand').value,
  title: $('#title').value,
  category: $('#category').value,
  description: $('#desc').value,
  original_price: +$('#original').value,
  selling_price: +$('#selling').value,
  code: JSON.stringify(codes),
  stock: codes.length,
  active: true
};
  

  const { error } =
    await sb.from('coupons').insert(v);

  if (error) {
    alert(error.message);
  } else {
    alert('Coupon added successfully!');
    load();
  }
};
window.editStock = async id => {

  const { data: coupon, error: fetchError } = await sb
    .from('coupons')
    .select('code')
    .eq('id', id)
    .single();

  if (fetchError) {
    alert(fetchError.message);
    return;
  }

  let codes = [];

  try {
    codes = JSON.parse(coupon.code || '[]');

    if (!Array.isArray(codes)) {
      throw new Error();
    }
  } catch {
    alert('Coupon codes data is invalid.');
    return;
  }

  const newCodesText = prompt(
    `Current stock: ${codes.length}\n\n` +
    `Enter NEW coupon codes to ADD.\n` +
    `One code per line.\n\n` +
    `Leave empty if you only want to decrease stock.`
  );

  if (newCodesText === null) return;

  const newCodes = newCodesText
    .split('\n')
    .map(x => x.trim())
    .filter(Boolean);

  const existingCodes = new Set(codes);

  const duplicateCodes = newCodes.filter(
    code => existingCodes.has(code)
  );

  if (duplicateCodes.length > 0) {
    alert(
      'Duplicate coupon code found:\n\n' +
      duplicateCodes.join('\n')
    );
    return;
  }

  const uniqueNewCodes = [];

  for (const code of newCodes) {
    if (!uniqueNewCodes.includes(code)) {
      uniqueNewCodes.push(code);
    }
  }

  codes = [...codes, ...uniqueNewCodes];

  const removeText = prompt(
    `Stock after adding new codes: ${codes.length}\n\n` +
    `How many OLD/available codes do you want to REMOVE from the END?\n\n` +
    `Enter 0 to keep all ${codes.length} codes.`
  );

  if (removeText === null) return;

  const removeCount = Number(removeText);

  if (
    !Number.isInteger(removeCount) ||
    removeCount < 0 ||
    removeCount > codes.length
  ) {
    alert(
      `Enter a whole number between 0 and ${codes.length}.`
    );
    return;
  }

  if (removeCount > 0) {
    codes = codes.slice(0, codes.length - removeCount);
  }

  const { error } = await sb
    .from('coupons')
    .update({
      code: JSON.stringify(codes),
      stock: codes.length,
      active: codes.length > 0
    })
    .eq('id', id);

  if (error) {
    alert(error.message);
    return;
  }

  alert(
    `Stock updated successfully!\n\n` +
    `New stock: ${codes.length}`
  );

  load();
};
window.del = async id => {

  if (!confirm('Delete coupon?')) return;

  await sb
    .from('coupons')
    .delete()
    .eq('id', id);

  load();
};

$('#logout').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

checkAdmin();

</script>

</body>
</html>
