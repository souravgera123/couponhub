<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CouponHub Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>✦ CouponHub Admin</b><nav><a href="/">Store</a><button id="logout">Logout</button></nav></header><section><small>ADMIN</small><h2>Dashboard</h2><div id="stats"></div><div class="box"><input id="brand" placeholder="Brand"><input id="title" placeholder="Coupon title"><input id="category" placeholder="Category"><input id="desc" placeholder="Description"><input id="original" type="number" placeholder="Original price"><input id="selling" type="number" placeholder="Selling price"><input id="code" placeholder="Coupon code"><input id="stock" type="number" value="1" placeholder="Stock"><button class="btn" id="add">Add coupon</button></div><div id="list"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(COUPONHUB_CONFIG.SUPABASE_URL,COUPONHUB_CONFIG.SUPABASE_ANON_KEY);const $=s=>document.querySelector(s);
async function guard(){let {data:{user}}=await sb.auth.getUser();if(!user)return location.href='/';let {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin')return document.body.innerHTML='<section><h2>Admin access required.</h2><a href="/">Back to store</a></section>';load()}
async function load(){let {data:c}=await sb.from('coupons').select('*').order('created_at',{ascending:false});$('#list').innerHTML=(c||[]).map(x=>`<div class="order"><b>${x.title}</b> • ${x.category} • ₹${x.selling_price} • stock ${x.stock} <button onclick="del('${x.id}')">Delete</button></div>`).join('');let r=await fetch('/api/admin/stats',{headers:{Authorization:'Bearer '+(await sb.auth.getSession()).data.session.access_token}});let s=await r.json();$('#stats').innerHTML=`<div class="order"><b>Coupons:</b> ${s.coupons} &nbsp; <b>Orders:</b> ${s.orders} &nbsp; <b>Sales:</b> ₹${s.sales}</div>`}
$('#add').onclick=async()=>{let v={brand:$('#brand').value,title:$('#title').value,category:$('#category').value,description:$('#desc').value,original_price:+$('#original').value,selling_price:+$('#selling').value,code:$('#code').value,stock:+$('#stock').value,active:true};let {error}=await sb.from('coupons').insert(v);if(error)alert(error.message);else load()};window.del=async id=>{if(confirm('Delete coupon?')){await sb.from('coupons').delete().eq('id',id);load()}};$('#logout').onclick=()=>sb.auth.signOut().then(()=>location.href='/');guard();
</script></body></html>
